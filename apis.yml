name: StoneEagle F&I
description: >-
  StoneEagle F&I is an automotive Finance & Insurance (F&I) technology company
  that has spent more than 35 years building the software backbone of dealership
  F&I operations. Its product suite spans Variable Ops (StoneEagleMENU, an
  electronic F&I menu-selling and product-presentation system, and
  StoneEagleMETRICS, real-time DMS-sourced sales and F&I reporting), Fixed Ops
  (PENCILWRENCH and StoneEagleMETRICS SERVICE for the service drive), and
  industry benchmarking (StoneEagleDATA, transaction-level insight across more
  than half of U.S. franchised dealers). StoneEagle connects to dealerships
  through certified DMS integrations and partners such as Dealertrack and F&I
  Express, but publishes no public developer API, SDKs, or developer portal —
  integration is delivered as private, certified dealer and partner connections.
  Added to the API Evangelist network as a portfolio company of Battery Ventures.
